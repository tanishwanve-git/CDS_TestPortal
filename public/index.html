<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS Test Portal | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-container"></div>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome to CDS Test Portal</h2>
                <p>Sign in with your IIT Gandhinagar Google account</p>
            </div>

            <div id="authMessage"
                style="display: none; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500; font-size: 0.88rem;">
            </div>

            <div class="google-only-login">
                <p class="google-hint">Use your <strong>@iitgn.ac.in</strong> Google account to sign in</p>
                <div id="g_id_signin"></div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
