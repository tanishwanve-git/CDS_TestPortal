<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Apply a saved theme choice before anything paints, so there's no
         flash of the wrong theme. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* no storage access — falls back to prefers-color-scheme */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | CDS Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <button type="button" class="theme-toggle theme-toggle-floating" id="themeToggle" title="Toggle theme"></button>

    <main class="login-wrapper">
        <div class="login-card">

            <div class="login-mast">
                <img src="images/iitgn logo.png" alt="IIT Gandhinagar">
                <span class="brand-name">CDS Test Portal</span>
            </div>

            <div class="login-body">
                <div class="login-header">
                    <h1>Sign in</h1>
                    <p>Practice papers for the Cognitive &amp; Data Science programme.</p>
                </div>

                <div class="login-rule">
                    Access is limited to whitelisted students. Sign in with your
                    <strong>@iitgn.ac.in</strong> Google account.
                </div>

                <div class="notice notice-alert" id="authMessage"></div>

                <div class="google-slot" id="g_id_signin"></div>
            </div>

            <div class="login-foot">
                Trouble signing in? Contact the department office.
            </div>

        </div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
