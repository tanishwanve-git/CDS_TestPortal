<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CDS Test Portal | Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Google Fonts -->
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-container"></div>

    <header class="header">
        <div class="logo-left">
            <img src="images/iitgn logo.png" alt="College Logo">
        </div>
        <div class="logo-right">
            <img src="images/CDS-Logo.jpg" alt="CDS Logo">
        </div>
    </header>

    <main class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <h2>Welcome to CDS Test Portal</h2>
                <p>Sign in to access your dashboard</p>
            </div>

            <div id="authMessage"
                style="display: none; padding: 10px; border-radius: 6px; margin-bottom: 15px; text-align: center; font-weight: 500;">
            </div>

            <form id="authForm" class="login-form" autocomplete="off">
                <div id="registrationFields" style="display: none;">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>
                    <div class="input-group">
                        <label for="roll_number">Roll Number</label>
                        <input type="text" id="roll_number" placeholder="Enter your roll number">
                    </div>
                    <div class="input-group">
                        <label for="branch">Branch</label>
                        <select id="branch" required>
                            <option value="" disabled selected>Select your branch</option>
                            <option value="Computer Science Engineering">Computer Science Engineering</option>
                            <option value="Artificial Intelligence">Artificial Intelligence</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Integrated Circuit Design and Technology">Integrated Circuit Design and
                                Technology</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Chemical Engineering">Chemical Engineering</option>
                            <option value="Materials Engineering">Materials Engineering</option>
                        </select>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" id="togglePasswordBtn" class="toggle-password" title="Show/Hide password">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                    <div style="text-align: right; margin-top: 6px;">
                        <a href="forgot-password.html"
                            style="font-size: 0.82rem; color: #1a73e8; text-decoration: none; font-weight: 500;">Forgot
                            Password?</a>
                    </div>
                </div>

                <button type="submit" id="authBtn" class="btn-primary">Sign In</button>

                <div class="auth-toggle">
                    <p id="toggleText">Don't have an account? <a href="#" id="toggleAuth">Sign Up</a></p>
                </div>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div id="g_id_signin"></div>
            </form>

            <!-- Complete Profile Form (Shown for Google Sign-in if details are missing) -->
            <form id="completeProfileForm" class="login-form" style="display: none;" autocomplete="off">
                <p style="text-align: center; color: var(--text-light); margin-bottom: 20px; font-size: 0.95rem;">
                    Almost there! Please complete your profile.
                </p>

                <div class="input-group">
                    <label for="cp_name">Full Name</label>
                    <input type="text" id="cp_name" placeholder="Enter your full name" required>
                </div>

                <div class="input-group">
                    <label for="cp_roll_number">Roll Number</label>
                    <input type="text" id="cp_roll_number" placeholder="Enter your roll number" required>
                </div>

                <div class="input-group">
                    <label for="cp_branch">Branch</label>
                    <select id="cp_branch" required>
                        <option value="" disabled selected>Select your branch</option>
                        <option value="Computer Science Engineering">Computer Science Engineering</option>
                        <option value="Artificial Intelligence">Artificial Intelligence</option>
                        <option value="Electrical Engineering">Electrical Engineering</option>
                        <option value="Integrated Circuit Design and Technology">Integrated Circuit Design and
                            Technology</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Chemical Engineering">Chemical Engineering</option>
                        <option value="Materials Engineering">Materials Engineering</option>
                    </select>
                </div>

                <button type="submit" id="cpBtn" class="btn-primary">Save Profile</button>
            </form>
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
