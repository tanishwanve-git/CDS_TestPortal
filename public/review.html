<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Review | CDS Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .review-strip {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-bottom: 1px solid var(--ink);
            margin-bottom: 24px;
        }

        .review-strip h1 { font-size: 18px; font-weight: 700; }

        .review-strip .score {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .chart-box {
            border: 1px solid var(--rule);
            padding: 16px;
            height: 280px;
            display: flex;
            flex-direction: column;
        }

        .chart-box h3 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin-bottom: 12px;
        }

        .chart-box .chart-canvas-wrap { flex: 1; min-height: 0; position: relative; }

        /* ── Question cards: status carried by the left rule's pattern ──── */
        .question-review-card {
            position: relative;
            border: 1px solid var(--rule);
            padding: 16px 16px 16px 22px;
            margin-bottom: 14px;
        }

        .question-review-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--rule);
        }

        .question-review-card.correct::before { background: var(--ink); }

        .question-review-card.incorrect::before {
            background: repeating-linear-gradient(135deg,
                    var(--ink) 0 3px, var(--surface) 3px 6px);
        }

        .question-review-card.skipped::before { background: var(--surface-3); }

        .q-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .q-num { font-size: 13px; font-weight: 700; }
        .q-section { font-size: 12.5px; color: var(--ink-2); }

        .q-body {
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 14px;
        }

        .q-body img {
            max-width: 100%;
            max-height: 340px;
            height: auto;
            margin-top: 12px;
            border: 1px solid var(--rule);
        }

        .options-review { display: flex; flex-direction: column; gap: 6px; }

        .option-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 12px;
            border: 1px solid var(--rule);
            font-size: 14px;
        }

        .option-row img {
            max-height: 120px;
            max-width: 100%;
            height: auto;
            margin-top: 6px;
            border: 1px solid var(--rule);
        }

        /* The option they picked, when right: an ink ring, no colour spent */
        .option-row.is-student-correct {
            border-color: var(--ink);
            box-shadow: inset 0 0 0 1px var(--ink);
            font-weight: 600;
        }

        /* The option they picked, when wrong: struck through on a grey fill */
        .option-row.is-student-wrong {
            border-color: var(--rule-strong);
            background: var(--surface-2);
            text-decoration: line-through;
        }

        .option-icon {
            min-width: 14px;
            font-weight: 700;
            text-decoration: none;
            display: inline-block;
        }

        .hidden-answer-note {
            margin-top: 12px;
            font-size: 12.5px;
            color: var(--ink-2);
        }

        @media (max-width: 800px) {
            .charts-container { grid-template-columns: 1fr; }
            .summary-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">
            <img src="images/iitgn logo.png" alt="IIT Gandhinagar">
            <span class="brand-name">CDS Test Portal</span>
        </div>
        <div class="header-actions">
            <button type="button" class="btn btn-outline btn-sm"
                onclick="window.location.href=BASE_PATH+'/dashboard.html'">Dashboard</button>
            <button type="button" class="btn btn-danger btn-sm" id="logoutBtn">Sign out</button>
        </div>
    </header>

    <div class="page">

        <div class="review-strip">
            <h1 id="reviewTitle">Test review</h1>
            <span class="score" id="scoreBadge">Loading…</span>
        </div>

        <div class="summary-bar" id="summaryBar" style="display:none;">
            <div class="stat">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="sCorrect">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Wrong</div>
                <div class="stat-value" id="sWrong">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Skipped</div>
                <div class="stat-value" id="sSkipped">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="sTime">00:00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value accent" id="sScore">0</div>
            </div>
        </div>

        <div class="charts-container" id="chartsContainer" style="display:none;">
            <div class="chart-box">
                <h3>Section performance</h3>
                <div class="chart-canvas-wrap"><canvas id="sectionRadarChart"></canvas></div>
            </div>
            <div class="chart-box">
                <h3>Score comparison</h3>
                <div class="chart-canvas-wrap"><canvas id="comparisonChart"></canvas></div>
            </div>
        </div>

        <div class="loading-state" id="loadingMsg">Loading review data…</div>
        <div id="questionsContainer"></div>
    </div>

    <script>
        const subpathMatch = window.location.pathname.match(/^(\/mock[^\/]*)/);
        const BASE_PATH = subpathMatch ? subpathMatch[1] : '';
        const API_BASE = `${BASE_PATH}/api`;

        // Chart.js needs literal colours, so read them off the stylesheet once
        // rather than re-declaring the palette here.
        const css = getComputedStyle(document.documentElement);
        const INK = css.getPropertyValue('--ink').trim() || '#131316';
        const INK_2 = css.getPropertyValue('--ink-2').trim() || '#5A5A61';
        const RULE = css.getPropertyValue('--rule').trim() || '#D3D3D8';
        const RULE_STRONG = css.getPropertyValue('--rule-strong').trim() || '#A9A9B2';
        const ACCENT = css.getPropertyValue('--accent').trim() || '#1A4FBF';
        const ACCENT_WASH = css.getPropertyValue('--accent-wash').trim() || '#EAF0FC';

        // Prefix root-relative paths (e.g. "/questions/...") with the detected /mock subpath
        function resolveUrl(url) {
            return (typeof url === 'string' && url.startsWith('/')) ? `${BASE_PATH}${url}` : url;
        }

        const token = localStorage.getItem('token');
        const resultId = localStorage.getItem('reviewResultId');

        if (!token || !resultId) window.location.href = `${BASE_PATH}/dashboard.html`;

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            window.location.href = `${BASE_PATH}/index.html`;
        };

        async function loadReview() {
            try {
                // ── Cache check: serve from localStorage if fresh (< 30 min) ──
                const CACHE_KEY = `reviewCache_${resultId}`;
                const CACHE_TTL = 30 * 60 * 1000; // 30 minutes
                let reviewData = null;
                const cached = localStorage.getItem(CACHE_KEY);
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (Date.now() - parsed.cachedAt < CACHE_TTL) {
                            reviewData = parsed.data;
                        } else {
                            localStorage.removeItem(CACHE_KEY);
                        }
                    } catch { localStorage.removeItem(CACHE_KEY); }
                }

                if (!reviewData) {
                    const res = await fetch(`${API_BASE}/tests/result/${resultId}/review`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (!res.ok) throw new Error('Could not load review');
                    reviewData = await res.json();
                    // Store in cache for subsequent fast loads
                    try {
                        localStorage.setItem(CACHE_KEY, JSON.stringify({
                            cachedAt: Date.now(),
                            data: reviewData
                        }));
                    } catch { /* storage full — skip cache */ }
                }

                const { result, questions, stats } = reviewData;

                document.getElementById('reviewTitle').innerText = result.title;
                document.getElementById('scoreBadge').innerText =
                    `${result.score} / ${result.total_questions * 4}`;
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('summaryBar').style.display = 'grid';
                document.getElementById('chartsContainer').style.display = 'grid';

                let correct = stats.totalCorrect;
                let wrong = stats.totalNegatives;
                let skipped = result.total_questions - (correct + wrong);

                const container = document.getElementById('questionsContainer');
                let html = '';

                questions.forEach((q, idx) => {
                    const options = typeof q.options === 'string' ? JSON.parse(q.options) : q.options;
                    const studentAns = q.studentAnswer;

                    let status = 'skipped';
                    if (studentAns) {
                        status = q.isCorrect ? 'correct' : 'incorrect';
                    }

                    const tagClass = status === 'correct'
                        ? 'tag tag-solid'
                        : status === 'incorrect' ? 'tag' : 'tag tag-quiet';
                    const tagText = status === 'correct'
                        ? 'Correct'
                        : status === 'incorrect' ? 'Wrong' : 'Skipped';

                    let optionsHTML = '';
                    Object.entries(options).forEach(([key, val]) => {
                        let cls = '';
                        let icon = '&nbsp;';

                        const isImage = (typeof val === 'string' && val.match(/^(https?:\/\/|\/).*\.(png|jpg|jpeg|gif|webp|svg)$/i));
                        let displayValue = isImage
                            ? `<img src="${resolveUrl(val)}" alt="Option ${key}">`
                            : val;

                        // Highlight only what the student picked. Never reveal the key.
                        if (key === studentAns) {
                            if (status === 'correct') {
                                cls = 'is-student-correct';
                                icon = '&#10003;';
                            } else if (status === 'incorrect') {
                                cls = 'is-student-wrong';
                                icon = '&#10007;';
                            }
                        }

                        optionsHTML += `
                            <div class="option-row ${cls}">
                                <span class="option-icon">${icon}</span>
                                <div><strong>${key}</strong> &nbsp; ${displayValue}</div>
                            </div>`;
                    });

                    let qHtml = q.question_text.replace(/\n/g, '<br>');
                    if (q.image_url && q.image_url.trim() !== '') {
                        qHtml += `<img src="${resolveUrl(q.image_url)}" alt="Question image">`;
                    }

                    html += `
                        <div class="question-review-card ${status}">
                            <div class="q-meta-row">
                                <div>
                                    <span class="q-num">Question ${idx + 1}</span>
                                    <span class="q-section">&middot; ${escapeHtml(q.section_name)}</span>
                                </div>
                                <span class="${tagClass}">${tagText}</span>
                            </div>
                            <div class="q-body">${qHtml}</div>
                            <div class="options-review">${optionsHTML}</div>
                            ${status === 'incorrect'
                            ? '<p class="hidden-answer-note">The correct answer is not shown for this paper.</p>'
                            : ''}
                        </div>`;
                });

                container.innerHTML = html;

                document.getElementById('sCorrect').innerText = correct;
                document.getElementById('sWrong').innerText = wrong;
                document.getElementById('sSkipped').innerText = skipped;
                document.getElementById('sScore').innerText = result.score;

                // Format time taken (seconds to mm:ss)
                const totalSeconds = result.time_taken_seconds || 0;
                const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const seconds = (totalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('sTime').innerText = `${minutes}:${seconds}`;

                renderCharts(stats, result.score);

            } catch (err) {
                document.getElementById('loadingMsg').innerText = 'Failed to load review. ' + err.message;
            }
        }

        function renderCharts(stats, finalScore) {
            const labels = stats.sectionScores.map(s => s.name);
            const scores = stats.sectionScores.map(s => s.score);

            // Section performance — accent outline on a pale accent fill
            new Chart(document.getElementById('sectionRadarChart').getContext('2d'), {
                type: 'radar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Your score',
                        data: scores,
                        backgroundColor: ACCENT_WASH,
                        borderColor: ACCENT,
                        pointBackgroundColor: ACCENT,
                        pointBorderColor: ACCENT,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            grid: { color: RULE },
                            angleLines: { color: RULE },
                            pointLabels: { color: INK_2, font: { size: 11 } },
                            ticks: { color: INK_2, backdropColor: 'transparent', font: { size: 10 } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Score comparison — ink for the student, grey for the cohort
            new Chart(document.getElementById('comparisonChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['You', 'Average'],
                    datasets: [{
                        data: [finalScore, stats.averageScore],
                        backgroundColor: [ACCENT, RULE_STRONG],
                        borderWidth: 0,
                        borderRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: INK_2, font: { size: 11 } } },
                        y: { beginAtZero: true, grid: { color: RULE }, ticks: { color: INK_2, font: { size: 10 } } }
                    }
                }
            });
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        loadReview();
    </script>
</body>

</html>
