<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Review | CDS Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .review-strip {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding: 16px 0;
            border-bottom: 1px solid var(--ink);
            margin-bottom: 24px;
        }

        .review-strip h1 { font-size: 18px; font-weight: 700; }

        .review-strip .score {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .summary-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 28px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 32px;
        }

        .chart-box {
            border: 1px solid var(--rule);
            padding: 16px;
            height: 280px;
            display: flex;
            flex-direction: column;
        }

        .chart-box h3 {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin-bottom: 12px;
        }

        .chart-box .chart-canvas-wrap { flex: 1; min-height: 0; position: relative; }

        .hidden-answer-note {
            margin-bottom: 24px;
            font-size: 12.5px;
            color: var(--ink-2);
        }

        @media (max-width: 800px) {
            .charts-container { grid-template-columns: 1fr; }
            .summary-bar { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">
            <img src="images/iitgn logo.png" alt="IIT Gandhinagar">
            <span class="brand-name">CDS Test Portal</span>
        </div>
        <div class="header-actions">
            <button type="button" class="btn btn-outline btn-sm"
                onclick="window.location.href=BASE_PATH+'/dashboard.html'">Dashboard</button>
            <button type="button" class="btn btn-danger btn-sm" id="logoutBtn">Sign out</button>
        </div>
    </header>

    <div class="page">

        <div class="review-strip">
            <h1 id="reviewTitle">Test review</h1>
            <span class="score" id="scoreBadge">Loading…</span>
        </div>

        <div class="summary-bar" id="summaryBar" style="display:none;">
            <div class="stat">
                <div class="stat-label">Correct</div>
                <div class="stat-value" id="sCorrect">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Wrong</div>
                <div class="stat-value" id="sWrong">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Skipped</div>
                <div class="stat-value" id="sSkipped">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Time</div>
                <div class="stat-value" id="sTime">00:00</div>
            </div>
            <div class="stat">
                <div class="stat-label">Score</div>
                <div class="stat-value accent" id="sScore">0</div>
            </div>
        </div>

        <div class="charts-container" id="chartsContainer" style="display:none;">
            <div class="chart-box">
                <h3>Section performance</h3>
                <div class="chart-canvas-wrap"><canvas id="sectionRadarChart"></canvas></div>
            </div>
            <div class="chart-box">
                <h3>Score comparison</h3>
                <div class="chart-canvas-wrap"><canvas id="comparisonChart"></canvas></div>
            </div>
        </div>

        <div class="loading-state" id="loadingMsg">Loading review data…</div>
        <p class="hidden-answer-note" id="postSubmitNote" style="display:none;">
            Individual questions and answers are no longer available after submission.
            Only your section-wise and overall scores are shown below.
        </p>
    </div>

    <script>
        const subpathMatch = window.location.pathname.match(/^(\/mock[^\/]*)/);
        const BASE_PATH = subpathMatch ? subpathMatch[1] : '';
        const API_BASE = `${BASE_PATH}/api`;

        // Chart.js needs literal colours, so read them off the stylesheet once
        // rather than re-declaring the palette here.
        const css = getComputedStyle(document.documentElement);
        const INK = css.getPropertyValue('--ink').trim() || '#131316';
        const INK_2 = css.getPropertyValue('--ink-2').trim() || '#5A5A61';
        const RULE = css.getPropertyValue('--rule').trim() || '#D3D3D8';
        const RULE_STRONG = css.getPropertyValue('--rule-strong').trim() || '#A9A9B2';
        const ACCENT = css.getPropertyValue('--accent').trim() || '#1A4FBF';
        const ACCENT_WASH = css.getPropertyValue('--accent-wash').trim() || '#EAF0FC';

        // Prefix root-relative paths (e.g. "/questions/...") with the detected /mock subpath
        function resolveUrl(url) {
            return (typeof url === 'string' && url.startsWith('/')) ? `${BASE_PATH}${url}` : url;
        }

        const token = localStorage.getItem('token');
        const resultId = localStorage.getItem('reviewResultId');

        if (!token || !resultId) window.location.href = `${BASE_PATH}/dashboard.html`;

        document.getElementById('logoutBtn').onclick = () => {
            localStorage.clear();
            window.location.href = `${BASE_PATH}/index.html`;
        };

        async function loadReview() {
            try {
                // No caching of review data in localStorage: the API only ever
                // returns section-wise and overall scores now (no question
                // content or answers), so there's nothing sensitive to guard,
                // but we still always fetch fresh to reflect the latest stats.
                const res = await fetch(`${API_BASE}/tests/result/${resultId}/review`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) throw new Error('Could not load review');
                const reviewData = await res.json();

                // Clear out any stale cache from a previous version of this page
                // that may have stored full question/answer content.
                try { localStorage.removeItem(`reviewCache_${resultId}`); } catch { }

                const { result, stats } = reviewData;

                document.getElementById('reviewTitle').innerText = result.title;
                document.getElementById('scoreBadge').innerText =
                    `${result.score} / ${result.total_questions * 4}`;
                document.getElementById('loadingMsg').style.display = 'none';
                document.getElementById('summaryBar').style.display = 'grid';
                document.getElementById('chartsContainer').style.display = 'grid';
                document.getElementById('postSubmitNote').style.display = 'block';

                let correct = stats.totalCorrect;
                let wrong = stats.totalNegatives;
                let skipped = result.total_questions - (correct + wrong);

                document.getElementById('sCorrect').innerText = correct;
                document.getElementById('sWrong').innerText = wrong;
                document.getElementById('sSkipped').innerText = skipped;
                document.getElementById('sScore').innerText = result.score;

                // Format time taken (seconds to mm:ss)
                const totalSeconds = result.time_taken_seconds || 0;
                const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const seconds = (totalSeconds % 60).toString().padStart(2, '0');
                document.getElementById('sTime').innerText = `${minutes}:${seconds}`;

                renderCharts(stats, result.score);

            } catch (err) {
                document.getElementById('loadingMsg').innerText = 'Failed to load review. ' + err.message;
            }
        }

        function renderCharts(stats, finalScore) {
            const labels = stats.sectionScores.map(s => s.name);
            const scores = stats.sectionScores.map(s => s.score);

            // Section performance — accent outline on a pale accent fill
            new Chart(document.getElementById('sectionRadarChart').getContext('2d'), {
                type: 'radar',
                data: {
                    labels,
                    datasets: [{
                        label: 'Your score',
                        data: scores,
                        backgroundColor: ACCENT_WASH,
                        borderColor: ACCENT,
                        pointBackgroundColor: ACCENT,
                        pointBorderColor: ACCENT,
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            grid: { color: RULE },
                            angleLines: { color: RULE },
                            pointLabels: { color: INK_2, font: { size: 11 } },
                            ticks: { color: INK_2, backdropColor: 'transparent', font: { size: 10 } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Score comparison — ink for the student, grey for the cohort
            new Chart(document.getElementById('comparisonChart').getContext('2d'), {
                type: 'bar',
                data: {
                    labels: ['You', 'Average'],
                    datasets: [{
                        data: [finalScore, stats.averageScore],
                        backgroundColor: [ACCENT, RULE_STRONG],
                        borderWidth: 0,
                        borderRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: INK_2, font: { size: 11 } } },
                        y: { beginAtZero: true, grid: { color: RULE }, ticks: { color: INK_2, font: { size: 10 } } }
                    }
                }
            });
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }

        loadReview();
    </script>
</body>

</html>
