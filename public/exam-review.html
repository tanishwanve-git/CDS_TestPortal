<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attempt Review | CDS Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        /* ── Score summary ─────────────────────────────────────────────── */
        .score-hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            border: 1px solid var(--ink);
            padding: 20px;
            margin-bottom: 16px;
        }

        .score-hero .figure {
            font-size: 40px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .score-hero .figure .of {
            font-size: 20px;
            font-weight: 500;
            color: var(--ink-2);
        }

        .score-hero .meta {
            font-size: 13px;
            color: var(--ink-2);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .score-hero .meta strong { color: var(--ink); }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        /* ── Filters ───────────────────────────────────────────────────── */
        .filters {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--rule);
        }

        .chip {
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 14px;
            margin-bottom: -1px;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--ink-2);
            cursor: pointer;
        }

        .chip:hover { color: var(--ink); background: var(--surface-2); }
        .chip.active { color: var(--ink); border-bottom-color: var(--accent); }

        /* ── Question cards ────────────────────────────────────────────────
           Status is carried by the left rule's fill pattern and by the label,
           never by hue: solid = correct, hatched = incorrect, pale = skipped. */
        .q-card {
            position: relative;
            border: 1px solid var(--rule);
            padding: 16px 16px 16px 22px;
            margin-bottom: 14px;
        }

        .q-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: var(--rule);
        }

        .q-card.correct::before { background: var(--ink); }

        .q-card.wrong::before {
            background: repeating-linear-gradient(135deg,
                    var(--ink) 0 3px, var(--surface) 3px 6px);
        }

        .q-card.skipped::before { background: var(--surface-3); }

        .q-card-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .q-num { font-size: 14px; font-weight: 700; }

        .q-meta { font-size: 12.5px; color: var(--ink-2); }

        .q-verdict {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .q-marks-awarded {
            font-size: 12.5px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .q-image {
            display: block;
            width: 100%;
            height: auto;
            border: 1px solid var(--rule);
            cursor: zoom-in;
        }

        .answer-row {
            display: flex;
            gap: 32px;
            flex-wrap: wrap;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--rule);
        }

        .answer-row .label {
            display: block;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--ink-2);
            margin-bottom: 2px;
        }

        .answer-row .val {
            font-size: 15px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* A struck-through answer reads as wrong without spending a colour */
        .answer-row .val.is-wrong { text-decoration: line-through; }
        .answer-row .val.is-blank { color: var(--ink-3); font-weight: 500; }

        .image-lightbox {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 5000;
            padding: 24px;
            overflow: auto;
            background: rgba(19, 19, 22, 0.9);
            cursor: zoom-out;
        }

        .image-lightbox.show { display: block; }

        .image-lightbox img {
            display: block;
            margin: 0 auto;
            max-width: 1400px;
            width: 100%;
            height: auto;
            background: var(--surface);
            padding: 12px;
        }

        @media (max-width: 640px) {
            .stat-row { grid-template-columns: repeat(2, 1fr); }
            .score-hero .meta { text-align: left; }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">
            <span class="brand-name" id="reviewTitle">Attempt review</span>
        </div>
        <div class="header-actions">
            <button type="button" class="btn btn-outline btn-sm" id="retakeBtn" style="display:none;">Take again</button>
            <button type="button" class="btn btn-primary btn-sm" id="backBtn">Dashboard</button>
        </div>
    </header>

    <div class="page" id="reviewBody">
        <div class="loading-state" id="loadingMsg">Loading your attempt…</div>
    </div>

    <div class="image-lightbox" id="imageLightbox" onclick="closeLightbox()">
        <img id="lightboxImg" src="" alt="Question, full size">
    </div>

    <script>
        // Requires a trailing slash so a page named /mock*.html can never be
        // mistaken for a /mock subpath deployment.
        const subpathMatch = window.location.pathname.match(/^(\/mock[^\/]*)\//);
        const BASE_PATH = subpathMatch ? subpathMatch[1] : '';
        const API_BASE = `${BASE_PATH}/api`;

        const token = localStorage.getItem('token');
        const attemptId = localStorage.getItem('reviewAttemptId');

        let allQuestions = [];
        let activeFilter = 'all';
        let examId = null;

        document.getElementById('backBtn').onclick = () => {
            window.location.href = `${BASE_PATH}/dashboard.html`;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            if (!token || !attemptId) {
                window.location.href = `${BASE_PATH}/dashboard.html`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/tests/mock/attempt/${attemptId}/review`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Could not load this attempt');
                }

                const { attempt, questions, stats } = await res.json();
                allQuestions = questions;
                examId = attempt.exam_id;

                document.getElementById('reviewTitle').innerText = attempt.title;
                render(attempt, stats);

                // Re-attempting draws a completely different paper, so offer it here.
                const retakeBtn = document.getElementById('retakeBtn');
                retakeBtn.style.display = 'inline-flex';
                retakeBtn.onclick = startRetake;

            } catch (err) {
                document.getElementById('loadingMsg').innerText = 'Failed to load review. ' + err.message;
            }
        });

        function render(attempt, stats) {
            const pct = attempt.max_score > 0
                ? Math.round((attempt.score / attempt.max_score) * 100)
                : 0;
            const minutes = Math.floor((attempt.time_taken_seconds || 0) / 60);
            const seconds = (attempt.time_taken_seconds || 0) % 60;

            const sectionRows = stats.sectionScores.map(s => `
                <tr>
                    <td class="cell-name">${escapeHtml(s.name)}</td>
                    <td class="num">${fmt(s.score)} / ${fmt(s.maxScore)}</td>
                    <td class="num">${s.correct}</td>
                    <td class="num">${s.wrong}</td>
                    <td class="num">${s.skipped}</td>
                </tr>`).join('');

            document.getElementById('reviewBody').innerHTML = `
                <div class="score-hero">
                    <div>
                        <div class="eyebrow">Final score</div>
                        <div class="figure">${fmt(attempt.score)} <span class="of">/ ${fmt(attempt.max_score)}</span></div>
                    </div>
                    <div class="meta">
                        ${pct}% &middot; finished in ${minutes}m ${seconds}s<br>
                        Average over ${stats.attemptsOnThisExam} attempt(s):
                        <strong>${fmt(stats.averageScore)}</strong>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat"><div class="stat-label">Correct</div><div class="stat-value">${stats.totalCorrect}</div></div>
                    <div class="stat"><div class="stat-label">Incorrect</div><div class="stat-value">${stats.totalWrong}</div></div>
                    <div class="stat"><div class="stat-label">Unanswered</div><div class="stat-value">${stats.totalSkipped}</div></div>
                    <div class="stat"><div class="stat-label">Total</div><div class="stat-value">${attempt.total_questions}</div></div>
                </div>

                ${stats.sectionScores.length > 1 ? `
                <section style="margin-bottom:32px;">
                    <div class="section-head"><h2>Section breakdown</h2></div>
                    <div class="panel">
                        <div class="table-wrap">
                            <table class="table">
                                <thead><tr><th>Section</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th></tr></thead>
                                <tbody>${sectionRows}</tbody>
                            </table>
                        </div>
                    </div>
                </section>` : ''}

                <div class="section-head"><h2>Question by question</h2></div>
                <div class="filters">
                    <button type="button" class="chip active" data-filter="all" onclick="setFilter('all')">All ${allQuestions.length}</button>
                    <button type="button" class="chip" data-filter="wrong" onclick="setFilter('wrong')">Incorrect ${stats.totalWrong}</button>
                    <button type="button" class="chip" data-filter="skipped" onclick="setFilter('skipped')">Unanswered ${stats.totalSkipped}</button>
                    <button type="button" class="chip" data-filter="correct" onclick="setFilter('correct')">Correct ${stats.totalCorrect}</button>
                </div>
                <div id="questionList"></div>
            `;

            renderQuestions();
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.chip').forEach(c => {
                c.classList.toggle('active', c.dataset.filter === filter);
            });
            renderQuestions();
        }

        function renderQuestions() {
            const list = document.getElementById('questionList');
            const shown = allQuestions.filter(q =>
                activeFilter === 'all' ||
                (activeFilter === 'correct' && q.isCorrect) ||
                (activeFilter === 'wrong' && q.isWrong) ||
                (activeFilter === 'skipped' && q.isSkipped)
            );

            if (!shown.length) {
                list.innerHTML = '<div class="empty-state"><h3>Nothing in this category</h3></div>';
                return;
            }

            list.innerHTML = shown.map(q => {
                const status = q.isCorrect ? 'correct' : (q.isWrong ? 'wrong' : 'skipped');
                const label = q.isCorrect ? 'Correct' : (q.isWrong ? 'Incorrect' : 'Not answered');
                // Solid tag for correct, outlined for incorrect, quiet for blank —
                // weight and fill do the work that colour would otherwise do.
                const tagClass = q.isCorrect ? 'tag tag-solid' : (q.isWrong ? 'tag' : 'tag tag-quiet');
                const src = q.image_url.startsWith('/') ? `${BASE_PATH}${q.image_url}` : q.image_url;
                const awarded = `${q.marks_awarded > 0 ? '+' : ''}${fmt(q.marks_awarded)}`;

                return `
                <div class="q-card ${status}">
                    <div class="q-card-head">
                        <div>
                            <span class="q-num">Question ${q.position}</span>
                            <span class="q-meta">&middot; ${escapeHtml(q.section_name)} &middot; ${q.question_type}${q.source ? ' &middot; ' + escapeHtml(q.source) : ''}</span>
                        </div>
                        <span class="q-verdict">
                            <span class="${tagClass}">${label}</span>
                            <span class="q-marks-awarded">${awarded}</span>
                        </span>
                    </div>
                    <img class="q-image" src="${src}" alt="Question ${q.position}" onclick="openLightbox('${src}')">
                    <div class="answer-row">
                        <div>
                            <span class="label">Your answer</span>
                            <span class="val ${q.isWrong ? 'is-wrong' : ''} ${q.isSkipped ? 'is-blank' : ''}">${q.studentAnswer !== null ? escapeHtml(q.studentAnswer) : 'Blank'}</span>
                        </div>
                        <div>
                            <span class="label">Correct answer</span>
                            <span class="val">${escapeHtml(q.correctAnswer)}</span>
                        </div>
                        <div>
                            <span class="label">Marking</span>
                            <span class="val">+${fmt(q.marks)} / ${q.negative_marks > 0 ? '−' + fmt(q.negative_marks) : '0'}</span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function startRetake() {
            const btn = document.getElementById('retakeBtn');
            btn.disabled = true;
            btn.innerText = 'Preparing…';
            try {
                const res = await fetch(`${API_BASE}/tests/mock/${examId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Could not start a new attempt');

                localStorage.setItem('currentAttemptId', String(data.attemptId));
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                } catch { /* blocked — proceed anyway */ }
                window.location.href = `${BASE_PATH}/exam-arena.html`;
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = 'Take again';
            }
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('imageLightbox').classList.add('show');
        }

        function closeLightbox() {
            document.getElementById('imageLightbox').classList.remove('show');
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });

        function fmt(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return '—';
            return Number.isInteger(n) ? String(n) : n.toFixed(2);
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
    </script>
</body>

</html>
