<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Apply a saved theme choice before anything paints, so there's no
         flash of the wrong theme. -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem('theme');
                if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
            } catch (e) { /* no storage access — falls back to prefers-color-scheme */ }
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attempt Review | CDS Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <style>
        /* ── Score summary ─────────────────────────────────────────────── */
        .score-hero {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            border: 1px solid var(--ink);
            padding: 20px;
            margin-bottom: 16px;
        }

        .score-hero .figure {
            font-size: 40px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -0.02em;
            font-variant-numeric: tabular-nums;
        }

        .score-hero .figure .of {
            font-size: 20px;
            font-weight: 500;
            color: var(--ink-2);
        }

        .score-hero .meta {
            font-size: 13px;
            color: var(--ink-2);
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .score-hero .meta strong { color: var(--ink); }

        .stat-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }

        .post-submit-note {
            margin-bottom: 24px;
            font-size: 12.5px;
            color: var(--ink-2);
        }

        @media (max-width: 640px) {
            .stat-row { grid-template-columns: repeat(2, 1fr); }
            .score-hero .meta { text-align: left; }
        }
    </style>
</head>

<body>

    <header class="app-header">
        <div class="brand">
            <span class="brand-name" id="reviewTitle">Attempt review</span>
        </div>
        <div class="header-actions">
            <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme"></button>
            <button type="button" class="btn btn-outline btn-sm" id="retakeBtn" style="display:none;">Take again</button>
            <button type="button" class="btn btn-primary btn-sm" id="backBtn">Dashboard</button>
        </div>
    </header>

    <div class="page" id="reviewBody">
        <div class="loading-state" id="loadingMsg">Loading your attempt…</div>
    </div>

    <script>
        // Requires a trailing slash so a page named /mock*.html can never be
        // mistaken for a /mock subpath deployment.
        const subpathMatch = window.location.pathname.match(/^(\/mock[^\/]*)\//);
        const BASE_PATH = subpathMatch ? subpathMatch[1] : '';
        const API_BASE = `${BASE_PATH}/api`;

        const token = localStorage.getItem('token');
        const attemptId = localStorage.getItem('reviewAttemptId');

        let examId = null;

        document.getElementById('backBtn').onclick = () => {
            window.location.href = `${BASE_PATH}/dashboard.html`;
        };

        document.addEventListener('DOMContentLoaded', async () => {
            if (!token || !attemptId) {
                window.location.href = `${BASE_PATH}/dashboard.html`;
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/tests/mock/attempt/${attemptId}/review`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || 'Could not load this attempt');
                }

                const { attempt, stats } = await res.json();
                examId = attempt.exam_id;

                document.getElementById('reviewTitle').innerText = attempt.title;
                render(attempt, stats);

                // Re-attempting draws a completely different paper, so offer it here.
                const retakeBtn = document.getElementById('retakeBtn');
                retakeBtn.style.display = 'inline-flex';
                retakeBtn.onclick = startRetake;

            } catch (err) {
                document.getElementById('loadingMsg').innerText = 'Failed to load review. ' + err.message;
            }
        });

        function render(attempt, stats) {
            const pct = attempt.max_score > 0
                ? Math.round((attempt.score / attempt.max_score) * 100)
                : 0;
            const minutes = Math.floor((attempt.time_taken_seconds || 0) / 60);
            const seconds = (attempt.time_taken_seconds || 0) % 60;

            const sectionRows = stats.sectionScores.map(s => `
                <tr>
                    <td class="cell-name">${escapeHtml(s.name)}</td>
                    <td class="num">${fmt(s.score)} / ${fmt(s.maxScore)}</td>
                    <td class="num">${s.correct}</td>
                    <td class="num">${s.wrong}</td>
                    <td class="num">${s.skipped}</td>
                </tr>`).join('');

            document.getElementById('reviewBody').innerHTML = `
                <div class="score-hero">
                    <div>
                        <div class="eyebrow">Final score</div>
                        <div class="figure">${fmt(attempt.score)} <span class="of">/ ${fmt(attempt.max_score)}</span></div>
                    </div>
                    <div class="meta">
                        ${pct}% &middot; finished in ${minutes}m ${seconds}s<br>
                        Average over ${stats.attemptsOnThisExam} attempt(s):
                        <strong>${fmt(stats.averageScore)}</strong>
                    </div>
                </div>

                <div class="stat-row">
                    <div class="stat"><div class="stat-label">Correct</div><div class="stat-value">${stats.totalCorrect}</div></div>
                    <div class="stat"><div class="stat-label">Incorrect</div><div class="stat-value">${stats.totalWrong}</div></div>
                    <div class="stat"><div class="stat-label">Unanswered</div><div class="stat-value">${stats.totalSkipped}</div></div>
                    <div class="stat"><div class="stat-label">Total</div><div class="stat-value">${attempt.total_questions}</div></div>
                </div>

                ${stats.sectionScores.length > 1 ? `
                <section style="margin-bottom:32px;">
                    <div class="section-head"><h2>Section breakdown</h2></div>
                    <div class="panel">
                        <div class="table-wrap">
                            <table class="table">
                                <thead><tr><th>Section</th><th>Score</th><th>Correct</th><th>Wrong</th><th>Skipped</th></tr></thead>
                                <tbody>${sectionRows}</tbody>
                            </table>
                        </div>
                    </div>
                </section>` : ''}

                <p class="post-submit-note">
                    Individual questions and answers are no longer available after submission.
                    Only your section-wise and overall scores are shown above.
                </p>
            `;
        }

        async function startRetake() {
            const btn = document.getElementById('retakeBtn');
            btn.disabled = true;
            btn.innerText = 'Preparing…';
            try {
                const res = await fetch(`${API_BASE}/tests/mock/${examId}/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Could not start a new attempt');

                localStorage.setItem('currentAttemptId', String(data.attemptId));
                try {
                    const el = document.documentElement;
                    if (el.requestFullscreen) await el.requestFullscreen();
                } catch { /* blocked — proceed anyway */ }
                window.location.href = `${BASE_PATH}/exam-arena.html`;
            } catch (err) {
                alert(err.message);
                btn.disabled = false;
                btn.innerText = 'Take again';
            }
        }

        function fmt(value) {
            const n = Number(value);
            if (!Number.isFinite(n)) return '—';
            return Number.isInteger(n) ? String(n) : n.toFixed(2);
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => (
                { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
            ));
        }
    </script>
    <script src="js/theme.js"></script>
</body>

</html>
